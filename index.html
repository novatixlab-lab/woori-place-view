<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W플레이스 · W PLACE</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap">
<style>
  :root{--bg:#0B0D1E;--card:#14172E;--line:#262A4A;--lime:#D4F53C;--text:#E9EBF5;--dim:#8D92B5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif;font-weight:500}
  #app{display:grid;grid-template-columns:320px 1fr;height:100%}
  #panel{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:18px 16px 40px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:14px;line-height:1.5}
  h2{font-size:13px;color:var(--lime);margin:20px 0 8px;letter-spacing:.02em}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
  .row.two{grid-template-columns:repeat(2,1fr)}
  label{display:block;font-size:11.5px;color:var(--dim)}
  input,select{width:100%;margin-top:3px;background:#0B0D1E;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 8px;font:inherit;font-size:13.5px}
  input:focus,select:focus{outline:1px solid var(--lime)}
  .note{font-size:12.5px;color:var(--text);background:#0B0D1E;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px;line-height:1.55}
  .note b{color:var(--lime)}
  .cam{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px}
  .cam .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#0B0D1E;color:var(--text);padding:7px 11px;font-size:13px}
  button:hover{border-color:var(--lime)}
  button.on{background:var(--lime);color:#0B0D1E;border-color:var(--lime);font-weight:700}
  button.x{padding:2px 8px;color:var(--dim)}
  button.wide{width:100%}
  #main{position:relative;min-width:0}
  #bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
  #bar .sp{flex:1}
  #view{position:absolute;inset:0}
  canvas{display:block}
  #selchip{display:none;position:absolute;left:12px;top:56px;z-index:2;background:var(--lime);color:#0B0D1E;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
  .pick{outline:2px solid var(--lime);outline-offset:3px;border-radius:8px;transition:outline-color .2s}
  body:not(.viewer) #frame{cursor:grab}
  #brand{display:none}
  body.viewer #app{grid-template-columns:1fr;grid-template-rows:1fr}body.viewer #panel{display:none}
  body.viewer #main{order:0}body.viewer #view{bottom:34px}
  body.viewer #brand{display:flex;position:fixed;left:0;right:0;bottom:0;height:34px;align-items:center;justify-content:center;gap:8px;background:#0B0D1E;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);z-index:5}
  body.viewer #brand b{font-family:Unbounded,sans-serif;color:var(--text);letter-spacing:.02em}body.viewer #brand b i{color:var(--lime);font-style:normal}
  #vtitle{display:none}body.viewer #vtitle{display:block;position:absolute;left:12px;bottom:46px;z-index:2;background:rgba(11,13,30,.8);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;max-width:70%}
  body.viewer #framecap{bottom:10px;left:auto;right:10px}
  .sws{display:flex;gap:7px;margin:0 0 8px}.sws i{width:18px;height:18px;border-radius:50%;cursor:pointer;opacity:.55;border:2px solid transparent;box-sizing:border-box}.sws i:hover{opacity:.9}.sws i.on{opacity:1;border-color:#fff;box-shadow:0 0 8px currentColor}
  #frame{position:absolute;display:none;pointer-events:none;border:2px solid var(--lime);box-shadow:0 0 0 9999px rgba(5,6,15,.6);z-index:1;box-sizing:border-box}
  #framecap{position:absolute;left:10px;bottom:10px;background:rgba(11,13,30,.8);color:var(--lime);padding:5px 10px;border-radius:8px;font-size:13px}
  #main{overflow:hidden}
  input[type=range]{padding:0;accent-color:var(--lime)}
  #catbox,#vbox,#sharebox{position:fixed;inset:0;background:rgba(5,6,15,.8);z-index:9;padding:20px;overflow:auto}
  #catbox .in,#vbox .in,#sharebox .in{max-width:1100px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  #catbox .top,#vbox .top,#sharebox .top{display:flex;justify-content:space-between;align-items:center}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--card)}
  td:nth-child(3),td:nth-child(4),td:nth-child(5){font-variant-numeric:tabular-nums;white-space:nowrap}
  a{color:var(--lime)}
  #sheetbox{position:fixed;inset:0;background:rgba(5,6,15,.85);z-index:20;overflow:auto;padding:20px}
  #sheetbox .paper{max-width:1000px;margin:0 auto;background:#fff;color:#16181f;border-radius:10px;padding:26px 30px}
  #sheetbox h1{font-size:24px;margin:6px 0}#sheetbox .meta{font-size:13px;color:#4a4f5f;line-height:1.6}
  #sheetbox img.top{width:100%;max-height:520px;object-fit:contain;background:#0B0D1E;border-radius:8px;margin:12px 0}
  #sheetbox table{font-size:12.5px;color:#16181f}#sheetbox th{background:#f0f1f4;color:#333;position:static}#sheetbox td,#sheetbox th{border-bottom:1px solid #d9dbe2;padding:8px}
  #sheetbox td img{width:190px;border-radius:4px;display:block}#sheetbox button{background:#16181f;color:#fff;border:0}
  @media print{body>*:not(#sheetbox){display:none!important}#sheetbox{position:static;background:#fff;padding:0;overflow:visible}#sheetbox .paper{max-width:none;padding:0}.noprint{display:none!important}html,body{height:auto;background:#fff}}
  @media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:55% 45%}#main{order:-1}#panel{border-right:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="main"><div id="bar"></div><div id="view"></div><div id="frame"><span id="framecap"></span></div><div id="vtitle"></div><div id="selchip"></div></div>
</div>

<script>window.PLACE_PUBLIC=1</script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
// ───────── 설정값 (단위: m, 무대 높이만 cm) ─────────
const S = {
  venue:{w:20,d:11,h:5},
  unit:'1.2x1.2',
  tiers:[{name:'뒷줄',cols:4,rows:1,h:60},{name:'앞줄',cols:4,rows:2,h:20}],
  screen:{n:4,h:2.56,cw:0,text:'행사 타이틀'},
  presenter:{mode:'stand',dist:2},
  seats:{rows:4,cols:12,chair:-1,layout:'theater',angle:15,tableD:1.8,perTable:10,rise:30,back:3},
  items:[],
  cams:[{name:'CAM 1',x:0,dist:5.5,h:1.7,lens:'xa20',f:30,ext:0,shot:''},{name:'CAM 2',x:-6,dist:3,h:1.7,lens:'xa20',f:15,ext:0,shot:''},{name:'CAM 3',x:6,dist:3,h:1.7,lens:'xa20',f:15,ext:0,shot:''}]
};
const UNITS={'1.2x1.2':[1.2,1.2,'1,200 × 1,200mm'],'1.82x0.91':[1.82,0.91,'1,820 × 910mm']};
const HEIGHTS=[[0,'안 씀'],[20,'200mm'],[40,'400mm'],[60,'600mm']],LEDW=1.28;
const r2=v=>Math.round(v*100)/100;
const LENS=[[60,'넓게 (전체 풀샷)'],[35,'보통 (무대 전체)'],[20,'당겨서 (발표자 상반신)'],[10,'망원 (얼굴 클로즈업)']];
let view='3d',_pb=false;
// ── 공유(보기 전용): 배치 내용을 주소 뒤(#v=...)에 담는다. 서버에 저장하지 않으므로 어느 웹 주소에 올려도 열린다.
const VIEW=location.hash.startsWith('#v=');
const SHARE_BASE='https://novatixlab-lab.github.io/woori-place-view/';   // 보기 전용 화면을 올려 둔 주소 (tools/build_public.py 로 만든 묶음)
const b64u=u8=>{let t='';u8.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const pipe=async(u8,ts)=>new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());
async function packScene(o){const raw=new TextEncoder().encode(JSON.stringify(o));try{return 'z'+b64u(await pipe(raw,new CompressionStream('deflate-raw')))}catch(e){return 'j'+b64u(raw)}}
async function unpackScene(t){const u8=unb64u(t.slice(1));return JSON.parse(new TextDecoder().decode(t[0]==='z'?await pipe(u8,new DecompressionStream('deflate-raw')):u8))}
// 카메라: 블랙매직 URSA Broadcast G2 + B4 렌즈 = 2/3형(화면 가로 9.59mm, 16:9)
const SW=9.59;
const CAMCOL=['#D4F53C','#ff5fa2','#4fc3ff','#ffb347','#b388ff','#5ff0c0','#ff6b6b','#ffffff'],camCol=(c,i)=>c.color||CAMCOL[i%CAMCOL.length];
// 본체·해상도 설정에 따라 실제로 쓰는 센서 가로 폭(2/3형 환산, mm)
const BODIES={g2_4k:{n:'URSA G2 · 4K 설정',sw:9.59,ok:1,m:'B4 렌즈 원래 화각(2/3형) · 공식 사양'},
  g2_27k:{n:'URSA G2 · 2.7K(2.6K) 설정',sw:9.59*2688/3840,ok:0,m:'센서를 좁게 써서 4K보다 약 1.4배 더 당겨짐 · 계산값, 실제 화면으로 확인 필요'},
  st4k_mft:{n:'스튜디오 카메라 4K Pro · MFT 렌즈',sw:17.78,ok:1,m:'센서 가로 17.78mm (4/3형) · 판매처 사양'},
  st4k:{n:'스튜디오 카메라 4K Pro · B4 렌즈(어댑터)',sw:17.78/1.85,ok:0,m:'센서 17.78mm에 B4 어댑터 1.85배로 가정(G2 4K와 같은 화각) · 어댑터 모델 확인 필요'}};
const camSW=c=>(BODIES[c.body]||BODIES.g2_4k).sw,camSH=c=>camSW(c)*9/16;
const LENSES={xa16:{n:'후지논 16배',w:8,t:128,ok:1,m:'XA16x8 (8~128mm)'},xa20:{n:'후지논 20배',w:8.5,t:170,ok:1,m:'XA20sx8.5 (8.5~170mm)'},
  x21:{n:'후지논 21배',w:7.8,t:164,ok:0,m:'모델 미확인 · 7.8~164mm로 가정'},ha23:{n:'후지논 23배',w:7.6,t:175,ok:1,m:'HA23x7.6 (7.6~175mm)'},
  x30:{n:'후지논 30배',w:7.8,t:234,ok:0,m:'모델 미확인 · 7.8~234mm로 가정'},xa55:{n:'박스 55배',w:9.5,t:525,ok:1,m:'XA55x9.5 (9.5~525mm)'},
  mft14:{n:'MFT 광각 14mm (고정)',w:14,t:14,ok:1,mft:1,m:'MFT 광각 14mm · 줌 없음'},mft714:{n:'MFT 광각 줌 7~14mm',w:7,t:14,ok:0,mft:1,m:'MFT 광각 줌 7~14mm · 쓰는 렌즈인지 확인 필요'},
  mft1235:{n:'MFT 표준 줌 12~35mm',w:12,t:35,ok:0,mft:1,m:'MFT 표준 줌 12~35mm · 쓰는 렌즈인지 확인 필요'}};
const SHOTS=[['full','풀샷',2.3,.95],['knee','니샷',1.5,1.15],['waist','웨이스트',1.0,1.3],['bust','바스트',.7,1.42],['close','클로즈업',.38,1.6]];
const shotName=H=>H<=.5?'얼굴 클로즈업':H<=.85?'바스트 샷':H<=1.25?'웨이스트 샷':H<=1.9?'니샷':H<=3?'풀샷':'넓은 전경';
const lensR=c=>{const l=LENSES[c.lens]||LENSES.xa20,k=c.ext&&!l.mft?2:1;return [l.w*k,l.t*k,l]};
const camF=c=>{const [lo,hi]=lensR(c);return Math.max(lo,Math.min(hi,+c.f||lo))};
const camFov=c=>2*Math.atan(camSW(c)/(2*camF(c)))*180/Math.PI;
const zoomPos=c=>{const [lo,hi]=lensR(c);if(hi<=lo)return 0;return Math.round(1000*Math.log(camF(c)/lo)/Math.log(hi/lo))};
const camAim0=c=>{const sh=SHOTS.find(x=>x[0]===c.shot);return new THREE.Vector3(0,(G.ph||0)+(sh?sh[3]:1.3)-(G.sit?.42:0),G.pz||0)};
// 발표자를 향한 기본 방향에서 좌우(pan)·위아래(tilt)로 돌린 조준점
const camAim=c=>{const t=camAim0(c),pan=+c.pan||0,tilt=+c.tilt||0;if(!pan&&!tilt)return t;const p=camPos(c),v=t.clone().sub(p),L=v.length();
  v.applyAxisAngle(new THREE.Vector3(0,1,0),-pan*Math.PI/180);const hz=Math.hypot(v.x,v.z);v.y=Math.tan(Math.atan2(v.y,hz)+tilt*Math.PI/180)*hz;return p.add(v.setLength(L))};
const camTurn=c=>{const pan=+c.pan||0,tilt=+c.tilt||0;return (pan?`${pan>0?'오른쪽':'왼쪽'} ${Math.abs(pan)}°`:'')+(pan&&tilt?' · ':'')+(tilt?`${tilt>0?'위로':'아래로'} ${Math.abs(tilt)}°`:'')};
const camBase=c=>G.tierY?G.tierY(c.x,(G.frontZ||0)+c.dist):0;
const camPos=c=>new THREE.Vector3(c.x,c.h+camBase(c),(G.frontZ||0)+c.dist);
const r1=v=>Math.round(v*10)/10;
const CAT=(window.CATALOG||[]).map((c,i)=>Object.assign({},c,{id:i,ok:!!(c.w&&c.d&&c.h),sure:c.status==='확인'||c.status==='검색'}));
const CATS=[...new Set(CAT.map(c=>c.cat))];let pickCat=CATS[0];
const CHAIRS=CAT.filter(c=>c.cat==='의자'&&c.ok);
const dims=c=>c.ok?`${c.w}×${c.d}×${c.h}mm`:'치수 안 나옴';
const badge=c=>!c.ok?'치수 안 나옴':c.status==='확인'?'치수 확인':c.status==='검색'?'검색 결과로 확인':c.status==='없음'?'치수 안 나옴 · 추정값':'통상값(미확인)';
const esc=t=>String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
let VENUES=[],vOpen=-1;
async function loadVenues(){try{const r=await fetch('api/venues');VENUES=r.ok?await r.json():[]}catch(e){VENUES=[]}}
const hdim=h=>(h.w&&h.d?`${h.w} × ${h.d}m`:'가로·세로 안 나옴')+(h.h?` · 높이 ${h.h}m`:' · 높이 안 나옴')+(h.area?` · ${h.area}㎡`:'');
const hstat=h=>h.w&&h.d?(h.status==='확인'?['공식 자료 확인','#D4F53C']:h.status==='추정'?['사진으로 어림한 값 · 실측 필요','#ffb347']:['검색값 · 재확인 필요','#9fd0ff']):['치수 안 나옴','#ff6b6b'];
function showVenues(){
  document.body.insertAdjacentHTML('beforeend',`<div id="vbox"><div class="in"><div class="top"><h1>행사장 찾기</h1><button id="closev">닫기</button></div>
  <input id="vq" placeholder="행사장 이름 · 홀 이름 · 주소 · 지역 (예: 벡스코, 해운대, 그랜드볼룸)" style="margin:10px 0 6px"><div class="sub" id="vsum"></div><div id="vres"></div></div></div>`);
  renderVenues();$('#vq').focus();
}
function renderVenues(){
  const q=($('#vq').value||'').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const hit=VENUES.map((v,i)=>({v,i})).filter(({v})=>{const t=[v.venue,v.region,v.address,v.type,...(v.halls||[]).map(h=>h.name)].join(' ').toLowerCase();return q.every(k=>t.includes(k))});
  const all=VENUES.flatMap(v=>v.halls||[]);
  $('#vsum').textContent=`행사장 ${VENUES.length}곳 · 홀 ${all.length}개 (가로·세로 있는 홀 ${all.filter(h=>h.w&&h.d).length}개, 도면 있는 홀 ${all.filter(h=>h.plan||h.planFile).length}개) · 지금 ${hit.length}곳 표시`;
  $('#vres').innerHTML=hit.slice(0,100).map(({v,i})=>{const open=vOpen===i||(q.length&&hit.length<=2);
    return `<div class="cam"><div class="top" data-vi="${i}" style="cursor:pointer"><b data-vi="${i}">${esc(v.venue)}</b><span class="sub" style="margin:0" data-vi="${i}">${esc(v.region||'')} · ${esc(v.type||'')} · 홀 ${(v.halls||[]).length}개 ${open?'▲':'▼'}</span></div>
    <div class="sub" style="margin:0">${esc(v.address||'')}${v.site?` · <a href="${esc(v.site)}" target="_blank" rel="noopener">홈페이지</a>`:''}</div>
    ${open?`<table style="margin-top:6px">${(v.halls||[]).map((h,j)=>{const st=hstat(h),c=h.cap||{},cap=[c.theater&&`극장식 ${c.theater}`,c.banquet&&`연회 ${c.banquet}`,c.class&&`강의 ${c.class}`].filter(Boolean).join(' · ');
      return `<tr><td><b>${esc(h.name)}</b> <span style="color:var(--dim)">${esc(h.floor||'')}</span>${h.note?`<div class="sub" style="margin:2px 0 0">${esc(h.note)}</div>`:''}</td><td>${hdim(h)}${cap?`<div class="sub" style="margin:2px 0 0">${cap}명</div>`:''}</td><td style="color:${st[1]}">${st[0]}</td>
      <td>${h.planFile||h.plan?`<a href="${esc(h.planFile||h.plan)}" target="_blank" rel="noopener">도면</a> `:''}${h.src?`<a href="${esc(h.src)}" target="_blank" rel="noopener">출처</a>`:''}</td>
      <td>${h.w&&h.d?`<button data-hall="${i},${j}">이 홀로 만들기</button>`:''}</td></tr>`}).join('')}</table>`:''}</div>`}).join('')||'<div class="note">찾는 행사장이 없습니다. 이름을 줄여서 다시 찾아 보세요.</div>';
}
function useHall(i,j){const v=VENUES[i],h=v.halls[j];
  S.venue={w:h.w,d:h.d,h:h.h||4,style:'hall',name:`${v.venue} · ${h.name}`,status:h.status,noH:!h.h,plan:h.planFile||h.plan||'',src:h.src||''};if(h.look)S.venue.look=JSON.parse(JSON.stringify(h.look));
  $('#vbox').remove();view='3d';panel();build();
}
const DEFAULT=JSON.stringify(S);let sceneName='',scenes=[],smsg='';
function serialize(){const o=JSON.parse(JSON.stringify(S));o.items.forEach(it=>{it.name=CAT[it.id]?CAT[it.id].name:''});o.seats.chairName=CAT[S.seats.chair]?CAT[S.seats.chair].name:'';return o}

document.addEventListener('input',e=>{

    const g=new THREE.Group();g.position.set(it.x,floorY(it.x,frontZ+it.z),frontZ+it.z);g.rotation.y=-(it.rot||0)*Math.PI/180;dyn.add(g);
    for(let i=0;i<nx;i++)for(let j=0;j<nz;j++)drawItem(g,c,(i-(nx-1)/2)*(w+gp),0,(j-(nz-1)/2)*(dd+gp));
    tl.push(`${c.name} <b>${nx*nz}개</b>${c.sure?'':' <span style="color:#ffb347">(치수 미확인)</span>'}`)});
  tl.push(`카메라 <b>${S.cams.length}대</b>`,(cwid?`LED 벽 <b>${sw} × ${S.screen.h}m</b>`:`폴딩 LED <b>${Math.max(0,Math.round(S.screen.n))}대</b>`));
  $('#tally').innerHTML=tl.join('<br>');

  S.cams.forEach((c,i)=>{tagTo('cam:'+i);
    const pos=camPos(c),aim=camAim(c),g=new THREE.Group();g.position.copy(pos);g.lookAt(aim);helpers.add(g);
    box(.28,.24,.5,mat.dark,0,0,0,g);const ln=new THREE.Mesh(new THREE.CylinderGeometry(.09,.11,.3,16),mat.dark);ln.rotation.x=Math.PI/2;ln.position.z=.38;g.add(ln);
    const base=camBase(c);box(.05,c.h,.05,mat.dark,c.x,base+c.h/2,frontZ+c.dist,helpers);
    const D=pos.distanceTo(aim),dist=D+1,hw=Math.tan(camFov(c)*Math.PI/360)*dist,hh=hw*9/16;

      if(el)el.innerHTML=(camTurn(c)?`<span style="color:#9fd0ff">발표자 방향에서 ${camTurn(c)} 돌림</span><br>`:'')+(base?`<span style="color:var(--lime)">객석 단 위 (바닥에서 +${r1(base)}m)</span><br>`:'')+`발표자까지 <b>${r1(D)}m</b> · 지금 <b>${Math.round(f)}mm</b><br>화면에 세로 ${r1(H)}m가 담김 → <b>${shotName(H)}</b><br>가장 넓게(${r1(lo)}mm): 가로 ${r1(D*SW/lo)}m가 담김<br>가장 당기면(${Math.round(hi)}mm): ${shotName(D*SH/hi)}<br>`+
        (fb<=hi?(fb>=lo?`바스트 샷은 <b>${Math.round(fb)}mm</b>에서 가능`:`바스트 샷보다 넓게는 못 잡음 (너무 가까움)`):`<span style="color:#ff6b6b">바스트 샷 불가</span> — 이 렌즈는 <b>${r1(hi*.7/SH)}m</b> 안에서만 바스트`)+
        `<br><span style="color:${l.ok?'var(--dim)':'#ffb347'}">${l.m}</span><br><span style="color:${bd.ok?'var(--dim)':'#ffb347'}">${bd.m}</span>`;}

function applyView(){
  const {w,d,h}=S.venue,inside=view==='seat'||view.startsWith('cam');
  roof.visible=inside;helpers.visible=!inside&&view!=='stage';controls.enabled=!inside;
  const asp=el.clientWidth/el.clientHeight;
  const hfov=deg=>camera.fov=2*Math.atan(Math.tan(deg*Math.PI/360)/asp)*180/Math.PI;
  if(view==='3d'){camera.fov=45;camera.position.set(w*.9,h*1.5,d*.75);controls.target.set(0,1,-d*.15)}
  else if(view==='stage'){camera.fov=40;camera.position.set(5.5,3.2,G.frontZ+6);controls.target.set(0,1,G.stageMidZ)}
  else if(view==='top'){camera.fov=45;camera.position.set(0,Math.max(d,w/asp)*1.25,.01);controls.target.set(0,0,0)}
  else if(view==='seat'){hfov(70);camera.position.set(0,1.5,Math.min(d/2-1,G.frontZ+8));controls.target.copy(G.aim)}
  else{const c=S.cams[+view.slice(3)];if(!c){view='3d';return applyView()}const fv=camFov(c);$('#frame').style.borderColor=camCol(c,+view.slice(3));if(asp>16/9)camera.fov=2*Math.atan(Math.tan(fv*Math.PI/360)/(16/9))*180/Math.PI;else hfov(fv);camera.position.copy(camPos(c));controls.target.copy(camAim(c));
    {const D=camPos(c).distanceTo(camAim(c));$('#framecap').textContent=`${c.name} · ${(BODIES[c.body]||BODIES.g2_4k).n} · ${lensR(c)[2].n}${c.ext?' ×2':''} · ${Math.round(camF(c))}mm · 거리 ${r1(D)}m · ${shotName(D*camSH(c)/camF(c))}`}}
  {const fr=$('#frame'),on=view.startsWith('cam'),W=el.clientWidth,H=el.clientHeight,fw=asp>16/9?H*16/9:W,fh=asp>16/9?H:W*9/16;fr.style.display=on?'block':'none';Object.assign(fr.style,{width:fw+'px',height:fh+'px',left:(W-fw)/2+'px',top:(H-fh)/2+'px'})}
  camera.updateProjectionMatrix();camera.lookAt(controls.target);controls.update();
}
function resize(){const W=el.clientWidth,H=el.clientHeight;renderer.setSize(W,H);camera.aspect=W/H;applyView()}

// 마우스: 살짝 누르면 고르기, 카메라 화면에서 끌면 방향 돌리기, 휠은 줌
{const cv=renderer.domElement;let dn=null;

  cv.addEventListener('pointermove',e=>{if(!dn)return;const dx=e.clientX-dn.x,dy=e.clientY-dn.y;if(Math.abs(dx)+Math.abs(dy)>4)dn.moved=true;
    if(!dn.moved||VIEW||!view.startsWith('cam'))return;const i=+view.slice(3),c=S.cams[i];if(!c)return;
    const perPx=camFov(c)/$('#frame').clientWidth;c.pan=Math.round(((+c.pan||0)-dx*perPx)*10)/10;c.tilt=Math.round(((+c.tilt||0)+dy*perPx)*10)/10;dn.x=e.clientX;dn.y=e.clientY;dn.turned=true;
    const a=document.querySelector(`[data-p="cams.${i}.pan"]`),b=document.querySelector(`[data-p="cams.${i}.tilt"]`);if(a)a.value=c.pan;if(b)b.value=c.tilt;applyView()});
  cv.addEventListener('pointerup',e=>{const d=dn;dn=null;if(!d)return;if(d.turned)return build();
    if(!d.moved&&!view.startsWith('cam')&&view!=='seat')selectTag(pickAt(e.clientX,e.clientY))});
  cv.addEventListener('wheel',e=>{if(VIEW||!view.startsWith('cam'))return;e.preventDefault();const i=+view.slice(3),c=S.cams[i];if(!c)return;
    c.f=camF(c)*Math.exp(-e.deltaY*.0015);c.f=camF(c);c.shot='';const z=document.querySelector(`[data-zoom="${i}"]`);if(z)z.value=zoomPos(c);
    document.querySelectorAll(`[data-shot^="${i},"]`).forEach(b=>b.classList.remove('on'));applyView();clearTimeout(cv._wt);cv._wt=setTimeout(build,250)},{passive:false});}
