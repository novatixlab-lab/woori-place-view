  th{color:var(--dim);font-weight:500;position:sticky;top:0;background:var(--card)}

  @media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:55% 45%}#main{order:-1}#panel{border-right:0;border-top:1px solid var(--line)}}

</head>

document.addEventListener('input',e=>{

  if(e.target.dataset.zoom!==undefined){const i=+e.target.dataset.zoom,c=S.cams[i],[lo,hi]=lensR(c);c.f=lo*Math.pow(hi/lo,e.target.value/1000);c.shot='';

  const p=e.target.dataset.p; if(!p)return;
  const v=e.target.dataset.str!==undefined?e.target.value:parseFloat(e.target.value);
  if(typeof v==='number'&&isNaN(v))return;
