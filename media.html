<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>W플레이스 미디어월 · W PLACE MEDIA</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600&display=swap">
<style>
  :root{--bg:#0B0D1E;--card:#14172E;--line:#262A4A;--lime:#D4F53C;--pink:#ff5fa2;--text:#E9EBF5;--dim:#8D92B5}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif;font-weight:500}
  #app{display:grid;grid-template-columns:330px 1fr;height:100%}
  #panel{background:var(--card);border-right:1px solid var(--line);overflow:auto;padding:18px 16px 60px}
  h1{font-size:19px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;margin-bottom:12px;line-height:1.55}
  h2{font-size:13px;color:var(--lime);margin:20px 0 8px;letter-spacing:.02em}
  .row{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
  .row.two{grid-template-columns:repeat(2,1fr)}
  label{display:block;font-size:11.5px;color:var(--dim)}
  input,select{width:100%;margin-top:3px;background:#0B0D1E;border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 8px;font:inherit;font-size:13.5px}
  input:focus,select:focus{outline:1px solid var(--lime)}
  input[type=color]{padding:2px;height:34px}
  .note{font-size:12.5px;background:#0B0D1E;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin:4px 0 8px;line-height:1.55}
  .note b{color:var(--lime)}
  .card{border:1px solid var(--line);border-left:3px solid var(--pink);border-radius:10px;padding:8px;margin-bottom:8px}
  .card.pick{outline:2px solid var(--lime);outline-offset:3px}
  .card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);background:#0B0D1E;color:var(--text);padding:7px 11px;font-size:13px}
  button:hover{border-color:var(--lime)}
  button.on{background:var(--lime);color:#0B0D1E;border-color:var(--lime);font-weight:700}
  button.x{padding:2px 8px;color:var(--dim)}
  button.wide{width:100%}
  .tpl{display:grid;gap:6px}.tpl button{text-align:left;line-height:1.4}.tpl small{display:block;color:var(--dim);font-size:11.5px;font-weight:500}
  #main{position:relative;min-width:0;overflow:hidden}
  #bar{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:2}
  #bar .sp{flex:1}
  #view{position:absolute;inset:0}
  canvas{display:block}
  #chip{display:none;position:absolute;left:12px;top:56px;z-index:2;background:var(--lime);color:#0B0D1E;font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px}
  #vtitle{display:none;position:absolute;left:12px;bottom:46px;z-index:2;background:rgba(11,13,30,.82);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px;max-width:70%;line-height:1.55}
  #brand{display:none;position:fixed;left:0;right:0;bottom:0;height:34px;align-items:center;justify-content:center;gap:8px;background:#0B0D1E;border-top:1px solid var(--line);font-size:12.5px;color:var(--dim);z-index:5}
  #brand b{font-family:Unbounded,sans-serif;color:var(--text)}#brand b i{color:var(--lime);font-style:normal}
  body.viewer #app{grid-template-columns:1fr}body.viewer #panel{display:none}body.viewer #view{bottom:34px}
  body.viewer #brand,body.viewer #vtitle{display:flex}body.viewer #vtitle{display:block}
  #box{position:fixed;inset:0;background:rgba(5,6,15,.82);z-index:20;padding:20px;overflow:auto}
  #box .in{max-width:620px;margin:8vh auto 0;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px}
  #box .top{display:flex;justify-content:space-between;align-items:center}
  @media(max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:55% 45%}#main{order:-1}#panel{border-right:0;border-top:1px solid var(--line)}}
  body.viewer #app{grid-template-rows:1fr!important}   /* 보기 화면은 휴대폰에서도 3D가 화면 전체 */
</style>
</head>
<body>
<div id="app">
  <div id="panel"></div>
  <div id="main"><div id="bar"></div><div id="view"></div><div id="chip"></div><div id="vtitle"></div></div>
</div>
<div id="brand"><b><i>W</i> PLACE</b><span>W플레이스는 우리미디어의 전용 플랫폼입니다.</span></div>
<meta name="robots" content="noindex,nofollow">
<script>window.PLACE_PUBLIC=1</script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
// ───────── W플레이스 미디어월 미리보기: 행사장 도면과 따로, 미디어 LED를 보여 줄 공간을 만들고 그 안에서 미디어월을 본다 ─────────
const $=s=>document.querySelector(s),R=Math.random,r1=v=>Math.round(v*10)/10,r2=v=>Math.round(v*100)/100;
const esc=t=>String(t??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const SHARE_PAGE='https://novatixlab-lab.github.io/woori-place-view/media.html';   // 보기 전용 화면을 올려 둔 주소 (tools/build_public.py)
const VIEW=location.hash.startsWith('#v=')||location.hash.startsWith('#s=')||!!window.PLACE_PUBLIC;
const HPAY=location.hash.slice(3).split('&')[0],HOPT=new URLSearchParams(location.hash.split('&').slice(1).join('&'));

// 공유 링크 (W플레이스와 같은 방식): 긴 링크 #v= 는 내용을 주소에, 짧은 링크 #s=번호.열쇠 는 암호화해 올리고 열쇠는 링크에만
const b64u=u8=>{let t='';u8.forEach(b=>t+=String.fromCharCode(b));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
const pipe=async(u8,ts)=>new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer());
async function packScene(o){const raw=new TextEncoder().encode(JSON.stringify(o));try{return 'z'+b64u(await pipe(raw,new CompressionStream('deflate-raw')))}catch(e){return 'j'+b64u(raw)}}
async function unpackScene(t){const u8=unb64u(t.slice(1));return JSON.parse(new TextDecoder().decode(t[0]==='z'?await pipe(u8,new DecompressionStream('deflate-raw')):u8))}
const aesKey=(raw,use)=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,[use]);
async function sealScene(o){const raw=new TextEncoder().encode(JSON.stringify(o));let body;try{body=await pipe(raw,new CompressionStream('deflate-raw'))}catch(e){return null}
  const key=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await aesKey(key,'encrypt'),body));
  const all=new Uint8Array(12+ct.length);all.set(iv);all.set(ct,12);const A='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
  return {id:[...crypto.getRandomValues(new Uint8Array(8))].map(b=>A[b%A.length]).join(''),blob:b64u(all),key:b64u(key)}}
async function openSealed(hash){const [id,k]=hash.split('.');if(!/^[A-Za-z0-9]{8}$/.test(id)||!k)throw 0;const r=await fetch('s/'+id+'.txt',{cache:'no-store'});if(!r.ok)throw r.status;
  const all=unb64u((await r.text()).trim()),pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:all.slice(0,12)},await aesKey(unb64u(k),'decrypt'),all.slice(12));
  return JSON.parse(new TextDecoder().decode(await pipe(new Uint8Array(pt),new DecompressionStream('deflate-raw'))))}

// ───────── 상태 ─────────
// 공간: 가운데가 0, 앞(관람객 쪽)이 +z, 뒤(벽면 미디어 쪽)가 −z. 면 하나 = {kind:'wall'|'ceil'|'floor', w,h(m), px,py, x,z, y(벽=하단 높이·천장=설치 높이·바닥=0), rot, bright, grid, mx,my, src, img, vimg, vid, name}
const SPACES={booth:'전시 부스 (트러스 · 열린 공간)',room:'실내 미디어룸 (벽·천장으로 막힌 공간)',stage:'블랙박스 · 어두운 무대'};
const FLOORS={grass:['인조잔디','#4f8a34'],carpet:['카펫','#3a3346'],wood:['우드','#a9794c'],concrete:['콘크리트','#8f8b83'],black:['블랙 무대','#16171c'],white:['화이트','#e8e6e1']};
const MKIND={wall:'벽면 LED',ceil:'천장 LED',floor:'바닥 LED'};
const MANIM=[['forest','숲 · 식물이 자라남'],['data','데이터 패널 · 빅데이터 입자'],['galaxy','은하수'],['wave','그라데이션 물결']];
const DEF={name:'',when:{date:'',note:''},space:{type:'booth',w:12,d:6,h:4.2,floor:'grass',wallc:'#2a3238',plants:1,people:2,truss:1},surfaces:[]};
const TPL={
  forest:{n:'FOREST OF BIGDATA 부스',d:'12×6m 트러스 부스 · 벽면 12×3m + 천장 9×3.5m · 식재',s:{name:'FOREST OF BIGDATA',space:{type:'booth',w:12,d:6,h:4.2,floor:'grass',wallc:'#2a3238',plants:1,people:2,truss:1},
    surfaces:[{kind:'wall',name:'벽면',w:12,h:3,px:3072,py:768,x:0,z:-2.7,y:.6,rot:0,bright:100,grid:1,mx:0,my:0,src:'data'},{kind:'ceil',name:'천장',w:9,h:3.5,px:2304,py:896,x:0,z:-.95,y:3.95,rot:0,bright:100,grid:1,mx:0,my:768,src:'forest'}]}},
  room:{n:'몰입형 미디어룸',d:'12×8×4m 방 · 정면·양옆 벽 + 바닥 LED',s:{name:'몰입형 미디어룸',space:{type:'room',w:12,d:8,h:4,floor:'black',wallc:'#15161c',plants:0,people:3,truss:0},
    surfaces:[{kind:'wall',name:'정면',w:12,h:4,px:3072,py:1024,x:0,z:-3.95,y:0,rot:0,bright:100,grid:0,mx:0,my:0,src:'galaxy'},
      {kind:'wall',name:'왼쪽',w:8,h:4,px:2048,py:1024,x:-5.95,z:0,y:0,rot:90,bright:100,grid:0,mx:0,my:1024,src:'wave'},
      {kind:'wall',name:'오른쪽',w:8,h:4,px:2048,py:1024,x:5.95,z:0,y:0,rot:-90,bright:100,grid:0,mx:2048,my:1024,src:'wave'},
      {kind:'floor',name:'바닥',w:12,h:8,px:3072,py:2048,x:0,z:0,y:0,rot:0,bright:80,grid:0,mx:0,my:0,src:'galaxy'}]}},
  single:{n:'벽면 한 장',d:'블랙 무대 · 벽면 LED 8×4.5m (16:9)',s:{name:'벽면 미디어월',space:{type:'stage',w:14,d:10,h:7,floor:'black',wallc:'#111217',plants:0,people:4,truss:1},
    surfaces:[{kind:'wall',name:'메인',w:8,h:4.5,px:1920,py:1080,x:0,z:-4,y:.5,rot:0,bright:100,grid:1,mx:0,my:0,src:'wave'}]}}};
let S=JSON.parse(JSON.stringify(DEF)),sceneName='',view='out',selTag='',msg='',SD=[];
const fixState=o=>{const d=JSON.parse(JSON.stringify(DEF));o=o&&typeof o==='object'?o:{};return {name:o.name||'',when:Object.assign(d.when,o.when),space:Object.assign(d.space,o.space),
  surfaces:(Array.isArray(o.surfaces)?o.surfaces:[]).filter(s=>s&&MKIND[s.kind])}};
const serialize=lite=>{const o=JSON.parse(JSON.stringify(S));o.surfaces.forEach(s=>{delete s.vid;if(lite){delete s.img;delete s.vimg;delete s.alts}});return o};
// 한 면에 시안 그림 여러 장(alts)을 넣어 두고 바꿔 볼 수 있다: 고른 것(pick)을 img 로 쓴다
function pickAlt(i,k){const s=S.surfaces[i];if(!s||!s.alts||!s.alts[k])return;s.pick=k;s.img=s.alts[k].img;s.src='img'}
const useTpl=k=>{S=fixState(JSON.parse(JSON.stringify(TPL[k].s)));view='out'};

// ───────── 3D ─────────
const el=$('#view');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
el.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,1,.05,300);
const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*.95;controls.minDistance=.5;controls.maxDistance=60;
const hemi=new THREE.HemisphereLight(0xeaf4ff,0x2a3a20,.75);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffffff,.9);sun.position.set(9,15,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16});scene.add(sun);
const M=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:new THREE.Color(c).convertSRGBToLinear(),roughness:.85},o));
const dark=M(0x15191c,{roughness:.6}),white=M(0xf2f2ef,{roughness:.8});
let dyn=new THREE.Group(),tmp=[];scene.add(dyn);
function box(w,h,d,m,x,y,z,p=dyn,sh=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=sh;o.receiveShadow=true;p.add(o);return o}
function ctex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=8;return t}
const rp=(t,x,y)=>{const c=t.clone();c.needsUpdate=true;c.repeat.set(Math.max(1,x),Math.max(1,y));tmp.push(c);return c};
const speck=(g,w,h,base,n,a)=>{g.fillStyle=base;g.fillRect(0,0,w,h);for(let i=0;i<n;i++){g.fillStyle=`rgba(${R()<.5?'0,0,0':'255,255,255'},${R()*a})`;g.fillRect(R()*w,R()*h,1.6,1.6)}};
const FTEX={},floorTex=k=>FTEX[k]||(FTEX[k]=ctex(256,256,(g,w,h)=>{const c=(FLOORS[k]||FLOORS.concrete)[1];
  if(k==='grass'){g.fillStyle=c;g.fillRect(0,0,w,h);for(let i=0;i<5000;i++){g.fillStyle=`hsl(${95+(R()-.5)*24},${45+R()*20}%,${28+R()*18}%)`;g.fillRect(R()*w,R()*h,1,3)}}
  else if(k==='wood'){g.fillStyle=c;g.fillRect(0,0,w,h);for(let x=0;x<w;x+=32){g.fillStyle=`rgba(0,0,0,${.03+R()*.1})`;g.fillRect(x,0,32,h);g.fillStyle='rgba(40,20,5,.45)';g.fillRect(x,0,1.5,h)}}
  else speck(g,w,h,c,k==='carpet'?9000:4000,k==='black'?.06:.1)}));
const trussTex=ctex(64,256,(g,w,h)=>{g.clearRect(0,0,w,h);g.strokeStyle='#f4f6f7';g.lineWidth=7;g.strokeRect(3,0,w-6,h);g.lineWidth=4;g.beginPath();for(let y=0;y<h;y+=64){g.moveTo(4,y);g.lineTo(w-4,y+32);g.lineTo(4,y+64)}g.stroke()});
function beam(a,b){const L=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]),gm=new THREE.BoxGeometry(.3,.3,L),uv=gm.attributes.uv,n=gm.attributes.normal;
  for(let i=0;i<uv.count;i++)if(Math.abs(n.getZ(i))<.5&&Math.abs(n.getY(i))<=.5)uv.setXY(i,uv.getY(i),uv.getX(i));
  const t=rp(trussTex,1,L/.3);const m=new THREE.Mesh(gm,new THREE.MeshStandardMaterial({map:t,alphaTest:.5,side:THREE.DoubleSide,metalness:.5,roughness:.35}));
  m.position.set((a[0]+b[0])/2,(a[1]+b[1])/2,(a[2]+b[2])/2);m.lookAt(b[0],b[1],b[2]);m.castShadow=true;dyn.add(m)}
const leafM=[0x2f6b25,0x3e8a2e,0x5a9e3a,0x76b043].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1,flatShading:true})),blob=new THREE.IcosahedronGeometry(1,0);
const leaf=(x,y,z,s)=>{const m=new THREE.Mesh(blob,leafM[Math.floor(R()*4)]);m.scale.setScalar(s);m.position.set(x,y,z);m.rotation.set(R()*3,R()*3,0);m.castShadow=true;dyn.add(m)};
function person(x,z,ry){const g=new THREE.Group(),m=M(0xdadada);const b=new THREE.Mesh(new THREE.CylinderGeometry(.19,.16,1.3,12),m);b.position.y=.75;g.add(b);
  const hd=new THREE.Mesh(new THREE.SphereGeometry(.12,12,10),M(0xd9b08c));hd.position.y=1.55;g.add(hd);g.position.set(x,0,z);g.rotation.y=ry;g.traverse(o=>o.castShadow=true);dyn.add(g)}
function label(text,x,y,z,s=.6){const c=document.createElement('canvas');c.width=640;c.height=96;const g=c.getContext('2d');g.fillStyle='rgba(11,13,30,.88)';g.beginPath();g.roundRect(2,2,636,92,24);g.fill();
  g.strokeStyle='#ff5fa2';g.lineWidth=3;g.stroke();g.fillStyle='#ff5fa2';g.font='600 40px Pretendard,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(text,320,50);
  const t=new THREE.CanvasTexture(c);tmp.push(t);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,toneMapped:false}));sp.scale.set(3.4*s,.51*s,1);sp.position.set(x,y,z);sp.renderOrder=9;sp.userData.lbl=1;dyn.add(sp)}

// 내장 애니메이션 (W플레이스 도면 쪽에서 쓰던 것과 같은 그림)
const MDRAW={
  forest(g,W,H,t,st){if(!st.p){const n=Math.max(8,Math.round(W/34));st.p=[...Array(n)].map((_,k)=>({x:(k+.5+(R()-.5)*.8)*W/n,hm:H*(.35+R()*.6),off:R(),sp:.05+R()*.05,lean:(R()-.5)*.5,hue:90+R()*60,wd:1.5+R()*2.5}));st.f=[...Array(70)].map(()=>({x:R()*W,y:R()*H,a:R()*7,s:.3+R()}))}
    const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#020a10');gr.addColorStop(.6,'#03261a');gr.addColorStop(1,'#0a4a2a');g.fillStyle=gr;g.fillRect(0,0,W,H);
    g.globalCompositeOperation='lighter';g.strokeStyle='rgba(120,255,200,.07)';g.lineWidth=1;for(let y=(t*20)%40;y<H;y+=40){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke()}
    for(const p of st.p){const ph=(t*p.sp+p.off)%1,gro=Math.min(1,ph/.7),fade=ph>.9?1-(ph-.9)/.1:1,L=p.hm*(1-Math.pow(1-gro,3)),sw=Math.sin(t*.8+p.off*9)*6,ex=p.x+p.lean*L+sw,ey=H-L,cx=p.x+p.lean*L*.3,cy=H-L*.5;
      g.strokeStyle=`hsla(${p.hue},70%,45%,${.8*fade})`;g.lineWidth=p.wd;g.beginPath();g.moveTo(p.x,H);g.quadraticCurveTo(cx,cy,ex,ey);g.stroke();

  Object.assign(s,{rot:0,bright:100,grid:1,mx:0,my:0,px:Math.round(s.w*256),py:Math.round(s.h*256)});S.surfaces.push(s);return S.surfaces.length-1}

(async()=>{
  if(VIEW){document.body.classList.add('viewer');
    try{if(location.hash.startsWith('#s='))S=fixState((await openSealed(HPAY)).s);else if(location.hash.startsWith('#v=')){const o=await unpackScene(HPAY);S=fixState(o.s)}else useTpl('forest');
      view=HOPT.get('view')||(S.surfaces.length?'front':'out')}catch(e){useTpl('forest');document.body.insertAdjacentHTML('beforeend',`<div id="box"><div class="in" style="max-width:480px"><h1>링크를 열지 못했습니다</h1><div class="sub">${e===404?'방금 만든 링크라면 1분쯤 뒤에 다시 열어 주세요.':'주소가 중간에 잘렸을 수 있습니다. 보낸 분에게 링크를 다시 받아 주세요.'} 아래는 예시 화면입니다.</div><button id="close">닫기</button></div></div>`)}
    const d=S.when&&S.when.date?new Date(S.when.date+'T00:00:00'):null;
    $('#vtitle').innerHTML=`<b>${esc(S.name||'미디어월 미리보기')}</b>${d&&!isNaN(d)?`<br><span style="color:var(--lime)">${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일</span>`:''}<br><span style="color:var(--dim)">${S.surfaces.map(s=>`${MKIND[s.kind]} ${s.w}×${s.h}m`).join(' · ')}</span><br><span style="color:var(--dim)">위 버튼으로 시점을 바꾸고, 끌어서 돌려 봅니다</span>`;
    build();resize();camera.position.set(0,0,0);applyView();bar();return}
  try{const c=JSON.parse(localStorage.getItem('place-media-current')||'null');if(c&&c.s&&c.s.surfaces&&c.s.surfaces.length){S=fixState(c.s);sceneName=c.name||''}else useTpl('forest')}catch(e){useTpl('forest')}
  panel();build();resize();camera.position.set(0,0,0);view='front';applyView();bar();refresh();
})();
</script>
<script>
// 우군이 AI 포털 공통 메뉴 (사내 모드에서만)
if(!document.body.classList.contains('viewer')&&!window.PLACE_PUBLIC)fetch('/api/portal-shell').then(r=>r.ok?r.json():{}).then(sh=>{
  if(!sh.portal||!sh.categories||document.body.classList.contains('viewer'))return;
  const css=document.createElement('link');css.rel='stylesheet';css.href=sh.portal_url+'/static/shell/rail.css?v=20261102c';document.head.append(css);
  const js=document.createElement('script');js.src=sh.portal_url+'/static/shell/rail.js?v=20261103b';
  js.onload=()=>{const rail=document.createElement('nav');document.body.prepend(rail);document.body.classList.add('has-wr-rail','has-wr-tabs');
    const opt={categories:sh.categories,current:'pre',isAdmin:sh.is_admin,portalUrl:sh.portal_url,here:{id:'pre',href:'/media.html'},links:sh.links};
    window.WoogooniRail.render(rail,opt);const tabs=document.createElement('nav');document.body.append(tabs);window.WoogooniRail.renderTabs(tabs,{...opt,current:'more'});window.dispatchEvent(new Event('resize'))};
  document.head.append(js)}).catch(()=>{});
</script>
</body>
</html>
